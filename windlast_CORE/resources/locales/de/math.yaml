schemaVersion: 1
entries:
  abminderungsfaktor_schlankheit:
    label: Abminderungsfaktor zur Berücksichtigung der Schlankheit
    symbol: \psi_\lambda
  abminderungsfaktor_schlankheit_rohr:
    label: Abminderungsfaktor zur Berücksichtigung der Schlankheit
    symbol: \psi_\lambda
  bezugsflaeche:
    label: Bezugsfläche
    symbol: A_\text{ref}
  bezugsflaeche_anzeigetafel:
    label: Bezugsfläche
    symbol: A_\text{ref}
  bezugsflaeche_rohr:
    label: Bezugsfläche
    symbol: A_\text{ref,i}
    formula: A_{ref,i} = l_\text{Rohr} \cdot d_\text{Rohr}
  bezugsflaeche_traverse:
    label: Bezugsfläche
    symbol: A_\text{ref,i}
    formula: |-
      \begin{aligned}
      A_i &= 2 \cdot l_i \cdot d_\text{Gurt} + 3,2 \cdot l_i \cdot d_\text{Brace} \\
      A_{ref,i} &= A_i
      \end{aligned}
  bezugsflaeche_wand:
    label: Bezugsfläche
    symbol: A_\text{ref,ij}
  eingeschlossene_flaeche:
    label: Eingeschlossene Fläche
    symbol: A_{C,i}
  eingeschlossene_flaeche_traverse:
    label: Eingeschlossene Fläche
    symbol: A_{C,i}
    formula: A_{C,i} = l_i \cdot h_\text{Trav}
  grundkraftbeiwert:
    label: Grundkraftbeiwert
    symbol: c_{f,0,i}
  kraftbeiwert:
    label: Kraftbeiwert
    symbol: c_f
  kraftbeiwert_anzeigetafel:
    label: Kraftbeiwert
    symbol: c_f
    formula: |-
      c_f = \begin{cases}
      0 & \text{bei Anströmung parallel zur Fläche} \\
      1,8 & \text{in allen anderen Fällen}
      \end{cases}
  kraftbeiwert_rohr:
    label: Kraftbeiwert
    symbol: c_{f,i}
    formula: c_{f,i} = c_{f,0,i} \cdot \psi_{\lambda,i}
  kraftbeiwert_traverse:
    label: Kraftbeiwert
    symbol: c_{f,i}
    formula: c_{f,i} = c_{f,0,i} \cdot \psi_{\lambda,i}
  nettodruckkbeiwert_wand:
    label: Nettodruckbeiwert
    symbol: c_{p,net}
  reibwert:
    label: Reibwert
    symbol: \mu
    formula: \mu = \min_k\left(\mu_k\right)
  reibwert_bodenplatte:
    label: Reibwert
    symbol: \mu
    formula: \mu = \min_i\left(\mu_i\right)
  reynoldszahl:
    label: Reynoldszahl
    symbol: Re
  reynoldszahl_rohr:
    label: Reynoldszahl
    symbol: Re_i
    formula: Re_i = v_i \cdot \frac{d_\text{Rohr}}{\nu}
  reynoldszahl_traverse:
    label: Reynoldszahl
    symbol: Re_i
    formula: Re_i = Re_i = v_i \cdot \frac{d_\text{Gurt}}{\nu}
  schlankheit:
    label: Schlankheit
    symbol: \lambda
  schlankheit_rohr:
    label: Schlankheit
    symbol: \lambda
    formula: |-
      \begin{aligned}
      \lambda &= \begin{cases} 
      k \cdot \frac{l_{Rohr}}{d_{Rohr}} & \lambda \leq 70 \\
      70 & \lambda > 70
      \end{cases} \\
      \text{mit } k &= \begin{cases}
      1 & l_{Rohr} < 15 \\
      0,7 & l_{Rohr} \geq 50
      \end{cases}
      \end{aligned}
  schlankheit_traverse:
    label: Schlankheit
    symbol: \lambda
    formula: |-
      \begin{aligned}
      \lambda &= \begin{cases}
      k \cdot \frac{l_{Trav}}{\min\left(h_{Trav}, t_{Trav}\right)} & \lambda \leq 70 \\
      70 & \lambda > 70
      \end{cases} \\
      \text{mit } k &= \begin{cases}
      2 & l_{Trav} < 15 \\
      1,4 & l_{Trav} \geq 50
      \end{cases}
      \end{aligned}
  stroemungsgeschwindigkeit:
    label: Strömungsgeschwindigkeit
    symbol: v_i
    formula: v_i = \sqrt{\frac{2 \cdot q_i}{\rho_\text{Luft}}}

# =======================
# Abhebesicherheit
# =======================
  abhebe_normalkraft_down_element:
    label: Normalkraft nach unten
    symbol: N_{down,k}
    formula: N_{\text{down},k} = N_{\text{down},G,k} + N_{\text{down},W,k}
  abhebe_normalkraft_up_element:
    label: Normalkraft nach oben
    symbol: N_{up,k}
    formula: N_{\text{up},k} = N_{\text{up},G,k} + N_{\text{up},W,k}
  abhebe_normalkraft_down_richtung:
    label: Normalkraft nach unten
    symbol: N_{down,m}
    formula: N_{\text{down},m} = \sum_k N_{\text{down},k}
  abhebe_normalkraft_up_richtung:
    label: Normalkraft nach oben
    symbol: N_{up,m}
    formula: N_{\text{up},m} = \sum_k N_{\text{up},k}
  abhebe_sicherheit_richtung:
    label: Abhebesicherheit
    symbol: S_{\text{Abhebe},m}
    formula: |-
      \begin{cases}
      \infty &\text{für } N_{\text{up},m}=0\\
      \frac{N_{\text{down},m}}{N_{\text{up},m}} &\text{für } N_{\text{up},m}>0
      \end{cases}
  abhebe_sicherheit:
    label: Abhebesicherheit
    symbol: S_{\text{Abhebe}}
    formula: S_\text{Abhebe} = \min_m \left(S_{\text{Abhebe},m}\right)
  abhebe_ballast_richtung:
    label: Ballastkraft
    symbol: F_{\text{Ball,Abhebe},m}
    formula: |-
      F_{\text{Ball,Abhebe},m} = \begin{cases}
      0 &\text{für } N_{\text{up},m} = 0\\
      \max \left(0, \frac{N_{\text{up},m} - N_{\text{down},m}}{\gamma_\text{Ball}}\right) &\text{für } N_{\text{up},m} > 0
      \end{cases}
  abhebe_ballast:
    label: Ballast
    symbol: m_\text{Ball,Abhebe}
    formula: |-
      \begin{aligned}
      F_\text{Ball,Abhebe} &= \max_m F_{\text{Ball,Abhebe},m} \\
      m_\text{Ball,Abhebe} &= \frac{F_\text{Ball,Abhebe}}{g}
      \end{aligned}

# =======================
# Gleitsicherheit
# =======================
  gleit_horizontalkraft_element:
    label: Horizontalkraft
    symbol: \vec{H}_k
    formula: \vec{H}_k = \vec{H}_j \quad \text{für das } j \text{ mit maximalem } H_j
  gleit_normalkraft_down_element:
    label: Normalkraft nach unten
    symbol: N_{\text{down},k}
    formula: N_{\text{down},k} = N_{\text{down},j} \quad \text{für das } j \text{ mit minimalem } N_{\text{eff},j}
  gleit_normalkraft_up_element:
    label: Normalkraft nach oben
    symbol: N_{\text{up},k}
    formula: N_{\text{up},k} = N_{\text{up},j} \quad \text{für das } j \text{ mit maximalem } H_j
  gleit_horizontalkraft_richtung:
    label: Horizontalkraft
    symbol: H_m
    formula: |-
      \begin{aligned}
      \vec{H}_m &= \sum_k \vec{H}_k\\
      H_m &= \left\|\vec{H}_m\right\|
      \end{aligned}
  gleit_normalkraft_down_richtung:
    label: Normalkraft nach unten
    symbol: N_{\text{down},m}
    formula: N_{\text{down},m} = \sum_k N_{\text{down},k}
  gleit_normalkraft_up_richtung:
    label: Normalkraft nach oben
    symbol: N_{\text{up},m}
    formula: N_{\text{up},m} = \sum_k N_{\text{up},k}
  gleit_normalkraft_effektiv_richtung:
    label: Effektive Normalkraft
    symbol: N_{\text{eff},m}
    formula: N_{\text{eff},m} = \max\left(0, N_{\text{down},m} - N_{\text{up},m}\right)
  gleit_reibkraft_richtung:
    label: Reibkraft
    symbol: F_{R,m}
    formula: F_{R,m} = \mu \cdot N_{\text{eff},m}
  gleit_sicherheit_richtung:
    label: Gleitsicherheit
    symbol: S_{\text{Gleit},m}
    formula: S_{\text{Gleit},m} = \frac{F_{R,m}}{H_m}
  gleit_sicherheit:
    label: Gleitsicherheit
    symbol: S_{\text{Gleit}}
    formula: S_\text{Gleit} = \min_m \left(S_{\text{Gleit},m}\right)
  gleit_ballast_richtung:
    label: Ballastkraft
    symbol: F_{\text{Ball,Gleit},m}
    formula: |-
      F_{\text{Ball,Gleit},m} = \begin{cases}
      \infty &\text{für } \mu = 0,\:H_m > 0\\
      0 &\text{für } \mu = 0,\:H_m = 0\\
      \max\left(0, \frac{\frac{H_m}{\mu} + N_{\text{up},m} - N_{\text{down},m}}{\gamma_\text{Ball}}\right) &\text{für } \mu > 0
      \end{cases}
  gleit_ballast:
    label: Ballast
    symbol: m_\text{Ball,Gleit}
    formula: |-
      \begin{aligned}
      F_\text{Ball,Gleit} &= \max_m F_{\text{Ball,Gleit},m} \\
      m_\text{Ball,Gleit} &= \frac{F_\text{Ball,Gleit}}{g}
      \end{aligned}

# =======================
# Kippsicherheit
# =======================
  kipp_kippmoment_element:
    label: Kippmoment
    symbol: M_{\text{Kipp},k}
    formula: M_{\text{Kipp},k} = M_{\text{Kipp},G,k} + M_{\text{Kipp},W,k}
  kipp_standmoment_element:
    label: Standmoment
    symbol: M_{\text{Stand},k}
    formula: M_{\text{Stand},k} = M_{\text{Stand},G,k} + M_{\text{Stand},W,k}
  kipp_kippmoment_achse:
    label: Kippmoment
    symbol: M_{\text{Kipp},l}
    formula: M_{\text{Kipp},l} = \sum_k M_{\text{Kipp},k}
  kipp_standmoment_achse:
    label: Standmoment
    symbol: M_{\text{Stand},l}
    formula: M_{\text{Stand},l} = \sum_k M_{\text{Stand},k}
  kipp_sicherheit_achse:
    label: Kippsicherheit
    symbol: S_{\text{Kipp},l}
    formula: |-
      S_{\text{Kipp},l} = \begin{cases}
      0,0 \quad &\text{für } M_{\text{Kipp},l} \leq 0\\
      \frac{M_{\text{Stand},l}}{M_{\text{Kipp},l}} \quad &\text{für } M_{\text{Kipp},l} > 0
      \end{cases}
  kipp_sicherheit_richtung:
    label: Kippsicherheit
    symbol: S_{\text{Kipp},m}
    formula: S_{\text{Kipp},m} = \min_l S_{\text{Kipp},l}
  kipp_sicherheit:
    label: Kippsicherheit
    symbol: S_{\text{Kipp}}
    formula: S_{\text{Kipp}} = \min_m S_{\text{Kipp},m}
  kipp_ballast_achse:
    label: Ballastkraft
    symbol: F_{\text{Ball,Kipp},l}
    formula: |-
      \begin{aligned}
      \vec{F}_E &= \begin{pmatrix} 0 \\ 0 \\ -1 \end{pmatrix} \\
      M_{\text{Kipp},1,l} &= \left(\left(\vec{s} - \vec{p}_{\text{Achse}}\right) \times \vec{F}_E\right) \cdot \hat{r}_{\text{Achse}} \\
      M_{\text{Stand},1,l} &= \max\left(0, -M_{\text{Kipp},1,l}\right) \\
      F_{\text{Ball,Kipp},l} &= \begin{cases}
      \infty &\text{für } M_{\text{Stand},1,l} \leq 0 \\
      \frac{M_{\text{diff},l}}{M_{\text{Stand},1,l} \cdot \gamma_{\text{Ball}}} &\text{für } M_{\text{Stand},1,l} > 0
      \end{cases}
      \end{aligned}
  kipp_ballast_richtung:
    label: Ballastkraft
    symbol: F_{\text{Ball,Kipp},m}
    formula: F_{\text{Ball,Kipp},m} = \max_l F_{\text{Ball,Kipp},l}
  kipp_ballast:
    label: Ballast
    symbol: m_\text{Ball,Kipp}
    formula: m_\text{Ball,Kipp} = \frac{F_\text{Ball,Kipp}}{g}
